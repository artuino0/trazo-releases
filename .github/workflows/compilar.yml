# Compila una versión de Trazo en este repo público (los minutos de Actions no se cobran) a partir del código
# privado de artuino0/trazo, que se baja con una llave de solo lectura (secreto TRAZO_DEPLOY_KEY). Deja todo en
# un borrador de release vX.Y.Z aquí mismo: Linux (AppImage, .deb, .rpm), Windows, macOS universal, latest.json
# firmado y el editor para Orquest. scripts/publicar.sh (en artuino0/trazo) agrega el APK y lo publica.
#
# Solo corre a mano (gh workflow run compilar.yml -R artuino0/trazo-releases -f version=vX.Y.Z), nunca con un
# pull request: los secretos y el código no salen de aquí. No imprimas secretos ni código en los pasos: los
# registros de este repo son públicos.
name: Compilar Trazo
run-name: Compilar Trazo ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Etiqueta de artuino0/trazo (vX.Y.Z)'
        required: true

permissions:
  contents: write

jobs:
  # El borrador de la release, uno solo (los tres sistemas suben a él).
  release:
    runs-on: ubuntu-22.04
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Versión no válida: $TAG"; exit 1; }
          find() { gh api "repos/$REPO/releases?per_page=100" --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"" | head -1; }
          HIT="$(find)"
          if [ -n "$HIT" ] && [ "${HIT#* }" != true ]; then echo "$TAG ya está publicada"; exit 1; fi
          if [ -z "$HIT" ]; then
            gh release create "$TAG" -R "$REPO" --draft --title "Trazo $TAG" --notes "Descarga el archivo de tu sistema. Si ya tienes Trazo, se actualiza solo." > /dev/null
            HIT="$(find)"
          fi
          echo "id=${HIT%% *}" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: artuino0/trazo
          ref: ${{ inputs.version }}
          ssh-key: ${{ secrets.TRAZO_DEPLOY_KEY }}
          persist-credentials: false

      - name: Dependencias de Linux
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          tagName: ${{ inputs.version }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # El editor para el Estudio de Orquest (ver AGENTS.md de artuino0/trazo): trazo-editor-X.Y.Z.zip con el build
  # web y las skills, firmado con la llave de las actualizaciones, y trazo-orquest.json.
  editor:
    needs: [release, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: artuino0/trazo
          ref: ${{ inputs.version }}
          ssh-key: ${{ secrets.TRAZO_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Armar, firmar y subir el editor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAG: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Versión no válida: $TAG"; exit 1; }
          V="${TAG#v}"
          npm run build
          OUT="$RUNNER_TEMP/orquest"
          mkdir -p "$OUT/pkg"
          cp -r dist "$OUT/pkg/editor"
          cp -r skills "$OUT/pkg/skills"
          test -f "$OUT/pkg/editor/index.html"
          ls "$OUT"/pkg/skills/*/SKILL.md > /dev/null
          ZIP="trazo-editor-$V.zip"
          (cd "$OUT/pkg" && zip -qr "$OUT/$ZIP" editor skills)
          npx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$OUT/$ZIP" > /dev/null
          SHA=$(sha256sum "$OUT/$ZIP" | cut -d' ' -f1)
          BYTES=$(stat -c %s "$OUT/$ZIP")
          OUT_JSON="$OUT/trazo-orquest.json" node -e '
            const [v, sha, bytes, sig] = process.argv.slice(1);
            const fs = require("fs");
            const json = {
              version: v,
              hostApi: 1,
              url: `https://github.com/artuino0/trazo-releases/releases/download/v${v}/trazo-editor-${v}.zip`,
              sha256: sha,
              firma: fs.readFileSync(sig, "utf8"),
              bytes: Number(bytes),
            };
            fs.writeFileSync(process.env.OUT_JSON, JSON.stringify(json, null, 2) + "\n");
          ' "$V" "$SHA" "$BYTES" "$OUT/$ZIP.sig"
          gh release upload "$TAG" -R "$REPO" --clobber "$OUT/$ZIP" "$OUT/$ZIP.sig" "$OUT/trazo-orquest.json"
